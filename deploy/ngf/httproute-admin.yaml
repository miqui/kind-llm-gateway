# /admin/* -> svc/llmgw:8081 (ADMIN_ADDR).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llmgw-admin
  namespace: llmgw
spec:
  parentRefs:
    - name: llmgw-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /admin
      backendRefs:
        - name: llmgw
          port: 8081
