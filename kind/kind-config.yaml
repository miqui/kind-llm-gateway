kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: llmgw
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    kubeReserved:
      memory: "512Mi"
- role: worker
