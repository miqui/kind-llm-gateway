apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server
  namespace: llmgw
  labels:
    app: llama-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-server
  template:
    metadata:
      labels:
        app: llama-server
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: ["llmgw-worker"]
      initContainers:
      - name: model-download
        image: curlimages/curl:8.10.1
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          echo "Downloading chat model (Qwen2.5-1.5B-Instruct Q4_K_M)..."
          curl -sfL --retry 3 -o /models/qwen2.5-1.5b-instruct-q4_k_m.gguf \
            https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf
          echo "Downloading embedding model (nomic-embed-text-v1.5 Q8_0)..."
          curl -sfL --retry 3 -o /models/nomic-embed-text-v1.5.Q8_0.gguf \
            https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/main/nomic-embed-text-v1.5.Q8_0.gguf
          ls -la /models/
        volumeMounts:
        - name: models
          mountPath: /models
      containers:
      - name: chat
        image: ghcr.io/ggml-org/llama.cpp:server
        args:
        - --host
        - "0.0.0.0"
        - --port
        - "8080"
        - --model
        - /models/qwen2.5-1.5b-instruct-q4_k_m.gguf
        - --ctx-size
        - "4096"
        - --parallel
        - "4"
        - --threads
        - "2"
        ports:
        - name: chat
          containerPort: 8080
        resources:
          requests:
            memory: "1800Mi"
            cpu: "500m"
          limits:
            memory: "2304Mi"
        volumeMounts:
        - name: models
          mountPath: /models
        readinessProbe:
          httpGet:
            path: /health
            port: chat
          initialDelaySeconds: 20
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health
            port: chat
          periodSeconds: 15
          failureThreshold: 3
      - name: embed
        image: ghcr.io/ggml-org/llama.cpp:server
        args:
        - --host
        - "0.0.0.0"
        - --port
        - "8081"
        - --model
        - /models/nomic-embed-text-v1.5.Q8_0.gguf
        - --embedding
        - --pooling
        - mean
        - --ctx-size
        - "2048"
        - --threads
        - "1"
        ports:
        - name: embed
          containerPort: 8081
        resources:
          requests:
            memory: "400Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
        volumeMounts:
        - name: models
          mountPath: /models
        readinessProbe:
          httpGet:
            path: /health
            port: embed
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health
            port: embed
          periodSeconds: 15
          failureThreshold: 3
      volumes:
      - name: models
        emptyDir:
          sizeLimit: 4Gi
