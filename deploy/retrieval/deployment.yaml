apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-svc
  namespace: llmgw
  labels:
    app: retrieval-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: retrieval-svc
  template:
    metadata:
      labels:
        app: retrieval-svc
    spec:
      containers:
        - name: retrieval-svc
          image: retrieval-svc:local
          imagePullPolicy: IfNotPresent
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger:4318"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 128Mi
              cpu: 250m
