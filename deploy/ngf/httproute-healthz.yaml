# /healthz -> svc/llmgw:8080 (LISTEN_ADDR), for external liveness checks
# through the gateway in addition to the in-cluster kubelet probe.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llmgw-healthz
  namespace: llmgw
spec:
  parentRefs:
    - name: llmgw-gateway
  rules:
    - matches:
        - path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: llmgw
          port: 8080
