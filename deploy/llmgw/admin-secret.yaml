# Lab-only literal admin key. NOT for production; rotate before any
# non-lab use. api_key is provided as a plain Secret literal for the
# in-cluster admin API (ADMIN_ADDR :8081).
apiVersion: v1
kind: Secret
metadata:
  name: llmgw-admin
  namespace: llmgw
type: Opaque
stringData:
  ADMIN_API_KEY: "sk-admin-0000000000000000"
